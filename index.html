<!DOCTYPE html>
<html>
<head>
    <title>76 Zetels</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" href="logo.png" type="image/png">
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background-color: #f5f5f5;
        }

        .logo img {
            height: 80px;
        }

        .logo-text {
            font-size: 54px;
            color: #007BFF; /* Bootstrap blue */
            margin-left: 15px;
            font-weight: bold;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="logo.png" alt="76 Zetels Logo">
        <div class="logo-text">76 Zetels</div>
    </div>

    <iframe src="https://76zetels.streamlit.app/?embed=True"></iframe>
</body>
</html>
